name: Manual Windows build
run-name: >-
  ${{ inputs.ui_checks_only && inputs.window_fixture_only && 'Invalid conflicting modes' || inputs.window_fixture_only && 'Window diagnostic' || inputs.ui_checks_only && 'UI checks' || 'Full Windows build' }} | ${{ github.ref_name }} | ${{ github.sha }} | attempt ${{ github.run_attempt }}

on:
  workflow_dispatch:
    inputs:
      ui_checks_only:
        description: Run pinned Flutter identity, locked analysis and UI tests only; no native build or artifacts
        type: boolean
        default: false
      window_fixture_only:
        description: Preinstalled-only owned Win32 diagnostic; BLOCKED unless trusted isolated x64 CPython 3.15.0 matches; no downloads/build artifacts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build-only Windows x64 with UI checks
    runs-on: windows-2025-vs2026
    timeout-minutes: ${{ (inputs.ui_checks_only || inputs.window_fixture_only) && 15 || 240 }}

    steps:
      - name: Checkout reviewed source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Reject conflicting diagnostic modes before any provisioning
        if: ${{ inputs.ui_checks_only && inputs.window_fixture_only }}
        shell: pwsh
        run: |
          throw 'Select only one diagnostic-only mode.'

      - name: Allocate a new runner-local job directory
        id: run-root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runRoot = Join-Path $env:RUNNER_TEMP ('cs-' + [Guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $runRoot) {
            throw 'The new runner-local job directory already exists.'
          }
          [void][IO.Directory]::CreateDirectory($runRoot)
          if ([IO.Directory]::GetFileSystemEntries($runRoot).Count -ne 0) {
            throw 'The newly allocated runner-local job directory was not empty.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "ci_root=$runRoot" -Encoding utf8

      - name: Select the single approved sanitized local math sidecar
        if: ${{ !inputs.window_fixture_only }}
        id: sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $docs = Join-Path $env:GITHUB_WORKSPACE 'docs'
          $sidecars = @(Get-ChildItem -LiteralPath $docs -File -Filter 'worker_math_golden_summary_*.json')
          if ($sidecars.Count -ne 1) {
            throw 'Exactly one approved dated local math-validation summary must be present in docs/.'
          }
          $namePattern = '^worker_math_golden_summary_(?<date>[0-9]{8})_(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\.json$'
          if (-not ($sidecars[0].Name -cmatch $namePattern)) {
            throw 'The math-validation summary must use a canonical dated UUID basename.'
          }
          $dateValue = [DateTime]::MinValue
          if (-not [DateTime]::TryParseExact($Matches['date'], 'yyyyMMdd', [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::None, [ref]$dateValue)) {
            throw 'The math-validation summary basename must contain a valid calendar date.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$($sidecars[0].FullName)" -Encoding utf8

      - name: Verify runner Python for trusted repository helpers
        id: host-python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Get-Command -Name 'python.exe' -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $versionText = & $python.Source -I -c "import sys; print('.'.join(map(str, sys.version_info[:3])))"
          if ($LASTEXITCODE -ne 0) {
            throw 'Runner-provided Python could not report its version.'
          }
          $version = [Version]$versionText.Trim()
          if ($version -lt [Version]'3.10.0') {
            throw 'Repository CI helpers require runner-provided Python 3.10 or newer.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$($python.Source)" -Encoding utf8
          Write-Output "Using runner-provided Python $version for repository helper scripts."

      # run-name 在 checkout 前求值；实际产品版本只能在此后读取并写入摘要与产物名。
      - name: Read bounded product version from the source pubspec
        id: product-version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $versionJson = & '${{ steps.host-python.outputs.path }}' -I -B (Join-Path $repo 'tools/build_windows.py') --version-summary
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $product = $versionJson | ConvertFrom-Json
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "package_stem=$($product.package_stem)" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value @(
            '### ChaSteady source product version',
            "Product: $($product.product_version); build: $($product.build_number); pubspec: $($product.pubspec_version)",
            'Source: ui/pubspec.yaml. Worker component/protocol and toolchain versions are separate.',
            'This source summary is not a PE verification, runtime acceptance, signing, or legal-clearance result.'
          )

      - name: Test CI guards without downloading or running native fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $python = '${{ steps.host-python.outputs.path }}'
          $tests = @(
            'tools/test_ci_provision_flutter.py',
            'tools/test_ci_prepare_assets.py',
            'tools/test_build_windows.py',
            'tools/test_ci_build_windows.py',
            'tools/test_ci_toolchain_preflight.py',
            'tools/test_project_conventions.py'
          )
          foreach ($test in $tests) {
            & $python -I (Join-Path $repo $test)
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Diagnose owned window fixture with preinstalled tools only
        if: ${{ inputs.window_fixture_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $ciRoot = '${{ steps.run-root.outputs.ci_root }}'
          # 先做无子进程的数据检查；不匹配则明确 BLOCKED，不下载或尝试 native 工具。
          & '${{ steps.host-python.outputs.path }}' -I -B (Join-Path $repo 'tools/ci_build_windows.py') `
            --root $repo --check-owned-runtime-only
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $report = Join-Path $ciRoot 'preinstalled-window-toolchain.json'
          & (Join-Path $repo 'tools/ci_toolchain_preflight.ps1') `
            -OutputPath $report `
            -RunnerLabel 'windows-2025-vs2026' `
            -FixtureProbeOnly
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $stage = Join-Path $ciRoot ('window-probe-' + [Guid]::NewGuid().ToString('N'))
          & '${{ steps.host-python.outputs.path }}' -I (Join-Path $repo 'tools/ci_build_windows.py') `
            --root $repo `
            --window-fixture-only `
            --toolchain-report $report `
            --preflight-stage $stage
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Check reviewed HEAD conventions and maintenance documents before the full build
        if: ${{ !inputs.ui_checks_only && !inputs.window_fixture_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          & '${{ steps.host-python.outputs.path }}' -I -B (Join-Path $repo 'tools/check_project_conventions.py') `
            --root $repo --check-head --check-docs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Create fresh Worker runtime using the current repository root
        if: ${{ !inputs.window_fixture_only }}
        id: worker-runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $private = Join-Path $repo 'private'
          $toolchains = Join-Path $private 'toolchains'
          foreach ($directory in @($private, $toolchains)) {
            if (Test-Path -LiteralPath $directory) {
              if (([IO.File]::GetAttributes($directory) -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw 'Ephemeral runtime output directory must not be a reparse point.'
              }
            } else {
              [void][IO.Directory]::CreateDirectory($directory)
            }
          }
          $report = Join-Path $repo ('docs/.ci-worker-runtime-{0}-{1}-{2}.json' -f `
            $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, [Guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $report) {
            throw 'Fresh Worker runtime report path already exists.'
          }
          & '${{ steps.host-python.outputs.path }}' -I (Join-Path $repo 'tools/provision_worker_runtime.py') `
            --root $repo --report $report
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$report" -Encoding utf8

      - name: Bind fresh audited helper Python and check owned compatibility before SDK download
        if: ${{ !inputs.window_fixture_only }}
        id: helper-python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $ciRoot = '${{ steps.run-root.outputs.ci_root }}'
          $receipt = '${{ steps.worker-runtime.outputs.path }}'
          $result = Join-Path $ciRoot 'helper-runtime.json'
          & '${{ steps.host-python.outputs.path }}' -I -B (Join-Path $repo 'tools/ci_build_windows.py') `
            --root $repo --prepare-helper-runtime-only `
            --helper-runtime-manifest $receipt --helper-runtime-result $result
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $handoff = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          $helper = $handoff.python_executable
          $digest = (Get-FileHash -LiteralPath $result -Algorithm SHA256).Hash.ToLowerInvariant()
          & $helper -I -B (Join-Path $repo 'tools/ci_build_windows.py') `
            --root $repo --check-owned-runtime-only `
            --helper-runtime-manifest $receipt --helper-runtime-result $result --helper-runtime-sha256 $digest
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$helper" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "result=$result" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha256=$digest" -Encoding utf8

      - name: Fetch and verify the pinned Noto font as ephemeral data
        if: ${{ !inputs.window_fixture_only }}
        id: font
        env:
          CHASTEADY_CI_FONT_GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $ciRoot = '${{ steps.run-root.outputs.ci_root }}'
          $scratch = Join-Path $ciRoot 'font-scratch'
          $result = Join-Path $ciRoot 'font-result.json'
          & '${{ steps.host-python.outputs.path }}' -I (Join-Path $repo 'tools/ci_prepare_assets.py') `
            --scratch-root $scratch `
            --provenance (Join-Path $repo 'ui/assets/fonts/PROVENANCE.txt') `
            --result-json $result
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "result=$result" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "scratch=$scratch" -Encoding utf8

      - name: Download and verify the pinned official Flutter SDK
        if: ${{ !inputs.window_fixture_only }}
        id: flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $ciRoot = '${{ steps.run-root.outputs.ci_root }}'
          $scratch = Join-Path $ciRoot 'f'
          $result = Join-Path $ciRoot 'flutter-result.json'
          & '${{ steps.host-python.outputs.path }}' -I (Join-Path $repo 'tools/ci_provision_flutter.py') `
            --scratch-root $scratch --result-json $result
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "result=$result" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "scratch=$scratch" -Encoding utf8

      - name: Verify Flutter executable identity before long toolchain updates
        if: ${{ !inputs.window_fixture_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $ciRoot = '${{ steps.run-root.outputs.ci_root }}'
          $stage = Join-Path $ciRoot ('flutter-preflight-' + [Guid]::NewGuid().ToString('N'))
          & '${{ steps.helper-python.outputs.path }}' -I -B (Join-Path $repo 'tools/ci_build_windows.py') `
            --root $repo `
            --helper-runtime-manifest '${{ steps.worker-runtime.outputs.path }}' `
            --helper-runtime-result '${{ steps.helper-python.outputs.result }}' `
            --helper-runtime-sha256 '${{ steps.helper-python.outputs.sha256 }}' `
            --preflight-flutter-only `
            --flutter-result '${{ steps.flutter.outputs.result }}' `
            --flutter-scratch '${{ steps.flutter.outputs.scratch }}' `
            --preflight-stage $stage
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Analyze and test isolated UI before long toolchain updates
        if: ${{ !inputs.window_fixture_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $ciRoot = '${{ steps.run-root.outputs.ci_root }}'
          $stage = Join-Path $ciRoot ('flutter-ui-preflight-' + [Guid]::NewGuid().ToString('N'))
          & '${{ steps.helper-python.outputs.path }}' -I -B (Join-Path $repo 'tools/ci_build_windows.py') `
            --root $repo `
            --helper-runtime-manifest '${{ steps.worker-runtime.outputs.path }}' `
            --helper-runtime-result '${{ steps.helper-python.outputs.result }}' `
            --helper-runtime-sha256 '${{ steps.helper-python.outputs.sha256 }}' `
            --preflight-ui-only `
            --flutter-result '${{ steps.flutter.outputs.result }}' `
            --flutter-scratch '${{ steps.flutter.outputs.scratch }}' `
            --font-result '${{ steps.font.outputs.result }}' `
            --font-scratch '${{ steps.font.outputs.scratch }}' `
            --preflight-stage $stage
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Update official stable Visual Studio and Windows SDK
        if: ${{ !inputs.ui_checks_only && !inputs.window_fixture_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ciRoot = '${{ steps.run-root.outputs.ci_root }}'
          $toolchainReport = Join-Path $ciRoot 'toolchain-preflight.json'
          & (Join-Path $env:GITHUB_WORKSPACE 'tools/ci_toolchain_preflight.ps1') `
            -OutputPath $toolchainReport `
            -RunnerLabel 'windows-2025-vs2026' `
            -UpdateStableVisualStudio `
            -InstallLatestWindowsSdk
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build, rerun backend tests, validate local math identity, and stage public-safe bundle
        if: ${{ !inputs.ui_checks_only && !inputs.window_fixture_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $ciRoot = '${{ steps.run-root.outputs.ci_root }}'
          $artifactDirectory = Join-Path $ciRoot 'artifacts'
          & '${{ steps.helper-python.outputs.path }}' -I -B (Join-Path $repo 'tools/ci_build_windows.py') `
            --root $repo `
            --helper-runtime-manifest '${{ steps.worker-runtime.outputs.path }}' `
            --helper-runtime-result '${{ steps.helper-python.outputs.result }}' `
            --helper-runtime-sha256 '${{ steps.helper-python.outputs.sha256 }}' `
            --toolchain-report (Join-Path $ciRoot 'toolchain-preflight.json') `
            --flutter-result '${{ steps.flutter.outputs.result }}' `
            --flutter-scratch '${{ steps.flutter.outputs.scratch }}' `
            --font-result '${{ steps.font.outputs.result }}' `
            --font-scratch '${{ steps.font.outputs.scratch }}' `
            --worker-manifest '${{ steps.worker-runtime.outputs.path }}' `
            --math-sidecar '${{ steps.sidecar.outputs.path }}' `
            --artifact-dir $artifactDirectory
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload only the app ZIP, digest, and sanitized manifest
        if: ${{ success() && !inputs.ui_checks_only && !inputs.window_fixture_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.product-version.outputs.package_stem }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.run-root.outputs.ci_root }}/artifacts/ChaSteady-Windows-x64.zip
            ${{ steps.run-root.outputs.ci_root }}/artifacts/ChaSteady-Windows-x64.zip.sha256
            ${{ steps.run-root.outputs.ci_root }}/artifacts/ChaSteady-Windows-x64.manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
